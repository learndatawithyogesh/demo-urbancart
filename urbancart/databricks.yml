# This is a Declarative Automation Bundle definition for urbancart.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: urbancart
  uuid: 05fdc2ff-5d2c-4c94-b4eb-eee9b311f8d3

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-e3f9f6a4-4aca.cloud.databricks.com
    variables:
      catalog: urbancart_dev
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-e3f9f6a4-4aca.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/yogesh025yc@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/yogesh025yc@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: urbancart_dev
      schema: prod
    permissions:
      - user_name: yogesh025yc@gmail.com
        level: CAN_MANAGE
