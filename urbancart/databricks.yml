# This is a Declarative Automation Bundle definition for urbancart.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: urbancart
  uuid: 05fdc2ff-5d2c-4c94-b4eb-eee9b311f8d3

include:
  - resources/*.yml

# Variable declarations.
variables:
  catalog:
    description: Catalog for the deployment

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-e3f9f6a4-4aca.cloud.databricks.com
    variables:
      catalog: urbancart_dev
  prod:
    mode: production
    workspace:
      host: https://adb-7405614290184103.3.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/
    variables:
      catalog: urbancart_prod
    permissions:
      - service_principal_name: 438fb306-16a4-4ecb-ae49-d0bf9c906e1b
        level: CAN_MANAGE
    run_as:
      service_principal_name: 438fb306-16a4-4ecb-ae49-d0bf9c906e1b
